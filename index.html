<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sudoku</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c6e49">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="screen-start" class="screen active">
  <h1 class="app-title">Sudoku</h1>

  <button id="btn-continue" class="btn btn-primary btn-continue hidden">Pokračovat v rozehrané hře</button>

  <p class="subtitle">Vyber obtížnost</p>
  <div class="difficulty-buttons">
    <button class="btn btn-difficulty" data-difficulty="easy">Lehká</button>
    <button class="btn btn-difficulty" data-difficulty="medium">Střední</button>
    <button class="btn btn-difficulty" data-difficulty="hard">Těžká</button>
  </div>

  <button id="btn-stats" class="btn btn-secondary btn-stats">Moje statistiky</button>
</section>

<section id="screen-game" class="screen">
  <div class="game-layout">
    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>
    <div class="side-panel">
      <div class="top-buttons">
        <button id="btn-back-menu" class="btn btn-secondary">Menu</button>
        <button id="btn-new-game" class="btn btn-secondary">Nová hra</button>
      </div>

      <div id="numpad" class="numpad">
        <button class="btn num-btn" data-num="1">1</button>
        <button class="btn num-btn" data-num="2">2</button>
        <button class="btn num-btn" data-num="3">3</button>
        <button class="btn num-btn" data-num="4">4</button>
        <button class="btn num-btn" data-num="5">5</button>
        <button class="btn num-btn" data-num="6">6</button>
        <button class="btn num-btn" data-num="7">7</button>
        <button class="btn num-btn" data-num="8">8</button>
        <button class="btn num-btn" data-num="9">9</button>
      </div>

      <div class="action-buttons">
        <button id="btn-erase" class="btn btn-action">Smazat</button>
        <button id="btn-undo" class="btn btn-action">Zpět</button>
        <button id="btn-hint" class="btn btn-action">Nápověda</button>
      </div>
    </div>
  </div>

  <div id="loading-overlay" class="overlay hidden">
    <div class="overlay-card">
      <p class="loading-text">Připravuji novou hru…</p>
    </div>
  </div>

  <div id="win-overlay" class="overlay hidden">
    <div class="overlay-card">
      <p class="win-text">Výborně!<br>Sudoku je hotové.</p>
      <button id="btn-next-game" class="btn btn-primary btn-huge">Další hra</button>
      <button id="btn-win-menu" class="btn btn-secondary btn-huge">Zpět do menu</button>
    </div>
  </div>
</section>

<section id="screen-stats" class="screen">
  <h1 class="app-title">Moje statistiky</h1>
  <div id="stats-content" class="stats-content"></div>
  <button id="btn-stats-back" class="btn btn-primary btn-huge">Zpět na hru</button>
</section>

<script src="app.js"></script>
</body>
</html>
